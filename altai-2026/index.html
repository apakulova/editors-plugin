<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Алтай · путеводитель</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f0e8;color:#183c2e;display:grid;place-items:center;min-height:100vh;margin:0}.l{text-align:center;padding:24px}.s{width:28px;height:28px;border:3px solid #ccd8ce;border-top-color:#245641;border-radius:50%;margin:0 auto 14px;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class=l><div class=s></div>Открываю путеводитель…</div><script>(async()=>{try{let s=(await Promise.all([0,1,2].map(i=>fetch(`p${i}.txt`).then(r=>r.text())))).join("");let b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));let ds=new DecompressionStream("gzip");let t=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML="<div class=l>Не удалось открыть путеводитель. Обновите страницу.</div>"}})()</script></body></html>
