name: Daily analytics report

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force_resend:
        description: "Отправить повторно, даже если отчёт за эту дату уже был доставлен"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-analytics-report
  cancel-in-progress: false

jobs:
  send-daily-analytics:
    name: Send daily analytics to Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTHOG_HOST: https://eu.posthog.com
      POSTHOG_PROJECT_ID: "184090"
      POSTHOG_DASHBOARD_URL: https://eu.posthog.com/project/184090/dashboard/695809
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NUMBER_DIAGNOSTICS_DATABASE_URL: ${{ secrets.NUMBER_DIAGNOSTICS_DATABASE_URL }}
      DAILY_REPORT_SOURCE: ${{ github.event_name == 'schedule' && 'github_primary' || 'github_manual' }}
      DAILY_REPORT_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_resend || false }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Send report
        run: npm run send-daily-analytics
