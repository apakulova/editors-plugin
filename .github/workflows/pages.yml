name: Publish landing to GitHub Pages

on:
  push:
    branches:
      - codex/chistovik-landing
    paths:
      - "landing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload landing
        uses: actions/upload-pages-artifact@v4
        with:
          path: landing

      - name: Publish landing
        id: deployment
        uses: actions/deploy-pages@v4
