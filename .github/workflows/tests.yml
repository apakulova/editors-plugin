name: Автоматические тесты

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Сборка и тесты — Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Скачать код
        uses: actions/checkout@v6

      - name: Подготовить Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Собрать и проверить
        run: npm test

      - name: Проверить собранные файлы
        run: git diff --exit-code
