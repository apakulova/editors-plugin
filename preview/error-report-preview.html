<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Превью окна проверки слоёв — Чистовик</title>
    <style>
      :root {
        --accent: #065c5b;
        --accent-dark: #054a49;
        --canvas: #eef0f2;
        --surface: #ffffff;
        --surface-active: #f0f4f3;
        --surface-hover: #f7f8f7;
        --border: #dbdbd9;
        --text: #141414;
        --text-secondary: #757575;
        --shadow: 0 22px 60px rgba(20, 20, 20, 0.16);
        color-scheme: light;
        font-family: Manrope, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background:
          radial-gradient(circle at 50% -10%, rgba(6, 92, 91, 0.09), transparent 34%),
          var(--canvas);
        color: var(--text);
        margin: 0;
        min-height: 100vh;
        padding: 32px 20px 48px;
      }

      button {
        font: inherit;
      }

      .preview {
        display: grid;
        gap: 18px;
        justify-items: center;
        margin: 0 auto;
        max-width: 760px;
      }

      .preview-controls {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }

      .preview-label {
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 700;
        line-height: 16px;
        margin-right: 4px;
      }

      .scenario-button {
        appearance: none;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 12px;
        line-height: 16px;
        padding: 7px 12px;
      }

      .scenario-button:hover {
        background: var(--surface);
        color: var(--text);
      }

      .scenario-button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }

      .window {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow);
        overflow: hidden;
        width: 720px;
      }

      .window-bar {
        align-items: center;
        border-bottom: 1px solid var(--border);
        display: grid;
        gap: 10px;
        grid-template-columns: 24px 1fr 24px;
        height: 52px;
        padding: 0 14px;
      }

      .window-icon {
        display: block;
        height: 24px;
        width: 24px;
      }

      .window-title {
        font-size: 16px;
        font-weight: 700;
        line-height: 20px;
      }

      .window-close {
        color: var(--text);
        font-size: 28px;
        font-weight: 300;
        line-height: 24px;
        text-align: center;
      }

      .report {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 500px;
      }

      .report-intro {
        border-bottom: 1px solid var(--border);
        display: grid;
        gap: 5px;
        padding: 16px;
      }

      .report-title {
        font-size: 16px;
        font-weight: 700;
        line-height: 20px;
        margin: 0;
      }

      .report-summary {
        color: var(--text-secondary);
        font-size: 12px;
        line-height: 16px;
        margin: 0;
      }

      .report-layout {
        display: grid;
        grid-template-columns: 268px minmax(0, 1fr);
        min-height: 0;
      }

      .report-layout.general {
        display: block;
      }

      .result-list {
        border-right: 1px solid var(--border);
        min-height: 0;
        overflow-y: auto;
      }

      .result-item {
        appearance: none;
        background: transparent;
        border: 0;
        color: inherit;
        cursor: pointer;
        display: grid;
        gap: 3px;
        min-height: 64px;
        padding: 8px 16px;
        text-align: left;
        width: 100%;
      }

      .result-item:hover {
        background: var(--surface-hover);
      }

      .result-item.active {
        background: var(--surface-active);
      }

      .result-item:focus-visible {
        background: var(--surface-active);
        outline: 0;
      }

      .text-preview {
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        display: -webkit-box;
        font-size: 12px;
        line-height: 16px;
        overflow: hidden;
      }

      .layer-name {
        color: var(--text-secondary);
        font-size: 11px;
        line-height: 15px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .detail {
        align-content: start;
        display: grid;
        gap: 14px;
        min-width: 0;
        padding: 18px 20px;
      }

      .detail.general {
        max-width: 500px;
        padding: 28px 24px;
      }

      .detail-heading {
        display: grid;
        gap: 6px;
      }

      .detail-title {
        font-size: 16px;
        font-weight: 700;
        line-height: 20px;
        margin: 0;
      }

      .detail-text {
        color: var(--text-secondary);
        font-size: 12px;
        line-height: 17px;
        margin: 0;
      }

      .check-section {
        display: grid;
        gap: 7px;
      }

      .check-title {
        font-size: 12px;
        font-weight: 700;
        line-height: 16px;
      }

      .check-list {
        display: grid;
        gap: 7px;
        margin: 0;
        padding: 0;
      }

      .check-list li {
        color: var(--text-secondary);
        font-size: 12px;
        line-height: 16px;
        list-style: none;
        padding-left: 17px;
        position: relative;
      }

      .check-list li::before {
        color: var(--accent);
        content: "✦";
        font-size: 10px;
        left: 0;
        line-height: 16px;
        position: absolute;
        top: 0;
      }

      @media (max-width: 760px) {
        body {
          padding: 20px 12px 36px;
        }

        .window {
          width: min(100%, 720px);
        }

        .report {
          height: auto;
          min-height: 560px;
        }

        .report-layout {
          grid-template-columns: 220px minmax(0, 1fr);
        }
      }

      @media (max-width: 560px) {
        .report-layout {
          grid-template-columns: 1fr;
        }

        .result-list {
          border-bottom: 1px solid var(--border);
          border-right: 0;
          max-height: 210px;
        }
      }
    </style>
  </head>
  <body>
    <main class="preview">
      <nav class="preview-controls" aria-label="Сценарии предпросмотра">
        <span class="preview-label">Сценарий:</span>
        <button class="scenario-button active" data-scenario="ordinary" type="button">Три проблемных слоя</button>
        <button class="scenario-button" data-scenario="critical" type="button">Критическая остановка</button>
        <button class="scenario-button" data-scenario="general" type="button">Общая ошибка</button>
      </nav>

      <section class="window" aria-label="Окно плагина Чистовик">
        <header class="window-bar">
          <img class="window-icon" src="../assets/plugin-icon.svg" alt="" />
          <div class="window-title">Чистовик</div>
          <div class="window-close" aria-hidden="true">×</div>
        </header>

        <div class="report">
          <header class="report-intro">
            <h1 class="report-title" id="reportTitle"></h1>
            <p class="report-summary" id="reportSummary"></p>
          </header>

          <div class="report-layout" id="reportLayout">
            <aside class="result-list" id="resultList" aria-label="Проблемные текстовые слои"></aside>
            <section class="detail" id="detail" aria-live="polite"></section>
          </div>
        </div>
      </section>
    </main>

    <script>
      const scenarios = {
        ordinary: {
          title: "Нужно проверить 3 слоя",
          summary: "Без ошибок обработано 10 слоёв. В трёх слоях нужна ручная проверка.",
          issues: [
            {
              preview: "Стоимость 1000 руб. в месяц, первые 30 дней бесплатно",
              layer: "pricing / card / caption",
              title: "Не удалось обработать слой",
              text: "Плагин не изменил этот слой. Исправьте текст вручную.",
              checks: [],
            },
            {
              preview: "Первый пункт списка, второй пункт и важное примечание",
              layer: "checklist / item",
              title: "Проверьте оформление",
              text: "Плагин не смог подтвердить, что оформление сохранилось полностью.",
              checks: ["Шрифт, жирность, цвет и подчёркивания", "Списки, ссылки, интервалы и отступы"],
            },
            {
              preview: "Заголовок карточки с подключённым библиотечным стилем",
              layer: "library card / title",
              title: "Проверьте связь с библиотекой",
              text: "Плагин не смог подтвердить, что подключённые стили сохранили связь с библиотекой.",
              checks: ["У текста по-прежнему указан нужный библиотечный стиль", "Внешний вид совпадает с исходным компонентом"],
            },
          ],
        },
        critical: {
          title: "Обработка остановлена",
          summary: "Без ошибок обработано 10 слоёв. Один слой нужно проверить. Два слоя не обработаны.",
          issues: [
            {
              preview: "Скидка 20% действует только до 15 мая — потом цена изменится",
              layer: "promo / legal note",
              title: "Проверьте текст и оформление",
              text: "Плагин не смог подтвердить, что вернул исходное состояние этого слоя.",
              checks: ["Текст не пропал и не изменился неожиданным образом", "Оформление и связь с библиотекой сохранились"],
            },
          ],
        },
        general: {
          title: "Не удалось запустить типограф",
          summary: "Обработка не началась. Текстовые слои не изменены.",
          generalTitle: "Попробуйте запустить ещё раз",
          generalText: "Плагин не смог начать обработку выбранной области.",
          generalChecks: ["Выделите один текстовый слой и повторите запуск", "Если ошибка повторяется, перезапустите Figma"],
        },
      };

      const reportTitle = document.getElementById("reportTitle");
      const reportSummary = document.getElementById("reportSummary");
      const reportLayout = document.getElementById("reportLayout");
      const resultList = document.getElementById("resultList");
      const detail = document.getElementById("detail");
      let currentScenario = "ordinary";
      let selectedIssueIndex = 0;

      function renderChecks(items) {
        if (!items || items.length === 0) {
          return "";
        }

        return `
          <div class="check-section">
            <div class="check-title">Что проверить</div>
            <ul class="check-list">${items.map((item) => `<li>${item}</li>`).join("")}</ul>
          </div>
        `;
      }

      function renderDetail(issue) {
        detail.className = "detail";
        detail.innerHTML = `
          <div class="detail-heading">
            <h2 class="detail-title">${issue.title}</h2>
            <p class="detail-text">${issue.text}</p>
          </div>
          ${renderChecks(issue.checks)}
        `;
      }

      function selectIssue(index) {
        const scenario = scenarios[currentScenario];
        selectedIssueIndex = index;

        Array.from(resultList.querySelectorAll(".result-item")).forEach((item, itemIndex) => {
          item.classList.toggle("active", itemIndex === index);
        });

        renderDetail(scenario.issues[index]);
      }

      function renderIssueList(scenario) {
        resultList.hidden = false;
        resultList.innerHTML = scenario.issues
          .map(
            (issue, index) => `
              <button class="result-item${index === selectedIssueIndex ? " active" : ""}" data-index="${index}" type="button">
                <span class="text-preview">${issue.preview}</span>
                <span class="layer-name">${issue.layer}</span>
              </button>
            `
          )
          .join("");

        resultList.querySelectorAll(".result-item").forEach((item) => {
          item.addEventListener("click", () => selectIssue(Number(item.dataset.index)));
        });

        renderDetail(scenario.issues[selectedIssueIndex]);
      }

      function renderGeneral(scenario) {
        reportLayout.className = "report-layout general";
        resultList.hidden = true;
        detail.className = "detail general";
        detail.innerHTML = `
          <div class="detail-heading">
            <h2 class="detail-title">${scenario.generalTitle}</h2>
            <p class="detail-text">${scenario.generalText}</p>
          </div>
          ${renderChecks(scenario.generalChecks)}
        `;
      }

      function renderScenario(name) {
        currentScenario = name;
        selectedIssueIndex = 0;
        const scenario = scenarios[name];

        document.querySelectorAll(".scenario-button").forEach((button) => {
          button.classList.toggle("active", button.dataset.scenario === name);
        });

        reportTitle.textContent = scenario.title;
        reportSummary.textContent = scenario.summary;

        if (scenario.issues) {
          reportLayout.className = "report-layout";
          renderIssueList(scenario);
        } else {
          renderGeneral(scenario);
        }
      }

      document.querySelectorAll(".scenario-button").forEach((button) => {
        button.addEventListener("click", () => renderScenario(button.dataset.scenario));
      });

      renderScenario(currentScenario);
    </script>
  </body>
</html>
